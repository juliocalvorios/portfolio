<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image - The Julio Calvo Times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FDF9F3;
            font-family: 'Crimson Text', serif;
        }

        .newspaper {
            width: 1200px;
            height: 630px;
            background: #FDF9F3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .masthead {
            text-align: center;
        }

        .masthead h1 {
            font-family: 'Crimson Text', serif;
            font-size: 88px;
            font-weight: 700;
            color: #2C2416;
            letter-spacing: 8px;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        .divider {
            width: 600px;
            height: 1px;
            background: #2C2416;
            margin: 0 auto 24px;
        }

        .masthead .tagline {
            font-family: 'Crimson Text', serif;
            font-size: 24px;
            font-weight: 400;
            color: #5C4F3D;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="masthead">
            <h1>THE JULIO CALVO TIMES</h1>
            <div class="divider"></div>
            <div class="tagline">Frontend Developer · Toronto, Canada</div>
        </div>
    </div>
</body>
</html>
